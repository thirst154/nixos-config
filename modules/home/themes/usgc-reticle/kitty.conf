# USGC-RETICLE-KT
# U.S. Graphics Company — RETICLE (dark scheme, photomask for lithography)
# PN# 5200-020 (Sublime Text) / PN# 5201-010 (iTerm)
#
# Converted from USGC-RETICLE-IT.itermcolors (Display P3 -> sRGB)
# and cross-referenced with USGC-RETICLE-ST.sublime-color-scheme.

# Basic colors
foreground              #009D5F
background              #000000
selection_foreground    #FFC200
selection_background    #000581

# Cursor
